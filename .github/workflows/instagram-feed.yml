name: Update Instagram Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Quotidiennement à minuit UTC

jobs:
  fetch-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create fallback Instagram data
        run: |
          mkdir -p src/data
          if [ ! -f src/data/instagram-posts.json ]; then
            echo '[]' > src/data/instagram-posts.json
          fi

      - name: Fetch Instagram Posts
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        continue-on-error: true
        run: |
          node scripts/fetch-instagram.js

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/instagram-posts.json; then
            echo "No changes to Instagram feed"
          else
            git add src/data/instagram-posts.json
            git commit -m "chore: update instagram feed"
            git push
          fi
